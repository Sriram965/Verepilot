[project]
name = "veripilot"
version = "0.1.0"
description = "Headless autonomous web-task agent runtime and benchmark"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "playwright==1.63.0",
    "langgraph==1.2.12",
    "langchain-openai==1.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "agent*",
    "tools*",
    "observation*",
    "verifier*",
    "recovery*",
    "environments*",
    "benchmark*",
    "eval*",
]
